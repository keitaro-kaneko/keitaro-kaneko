<path d="M830.0,138 V170" stroke="#8250df" stroke-width="1" stroke-dasharray="2 5" opacity=".7"/>
<path d="M1058.0,138 V170" stroke="#8250df" stroke-width="1" stroke-dasharray="2 5" opacity=".7"/>
<rect x="504" y="382" width="652" height="44" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.2"/>
<text x="522" y="410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Security loop</text>
<text x="644" y="410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">threat intel → attack → verify → one fix hardens every app</text>
<text x="48" y="410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">Every arrow is a workflow,</text>
<text x="48" y="428" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">not a meeting.</text>
