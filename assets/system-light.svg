<text x="522" y="236" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">apps · media · OSS</text>
<path class="f" d="M704,216.0 H728" stroke="#1a7f37" stroke-width="2"/>
<rect x="732" y="170" width="196" height="92" rx="12" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/>
