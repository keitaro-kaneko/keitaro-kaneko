<text x="750" y="236" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">rules · security · human</text>
<path class="f" d="M932,216.0 H956" stroke="#1a7f37" stroke-width="2"/>
<rect x="960" y="170" width="196" height="92" rx="12" fill="#f6f8fa" stroke="#9a6700" stroke-width="1.5"/>
