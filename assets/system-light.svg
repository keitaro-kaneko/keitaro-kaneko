<text x="978" y="236" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">SLOs · incidents</text>
<path class="f" d="M1058.0,266 V322 H374.0 V266" fill="none" stroke="#9a6700" stroke-width="2"/>
<text x="716.0" y="344" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">metrics · incidents · lessons written back into the pipeline</text>
<rect class="g" x="48" y="82" width="1104" height="56" rx="12" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="70" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">Separation of powers</text>
<text x="290" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">Legislature — writes the rules</text>
<text x="505" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">Executive — audits every org</text>
<text x="720" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">Judiciary — rules on changes</text>
<text x="935" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">Final say — a human</text>
