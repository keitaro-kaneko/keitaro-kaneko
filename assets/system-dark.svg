<text x="644" y="410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e">threat intel → attack → verify → one fix hardens every app</text>
<text x="48" y="410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e">Every arrow is a workflow,</text>
<text x="48" y="428" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e">not a meeting.</text>
